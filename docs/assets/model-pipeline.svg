<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title description">
  <title id="title">Sequential black-hole energy model pipeline</title>
  <desc id="description">The algebraic Kerr reservoir feeds Kerr geodesics, the Penrose split evaluator, Dijkstra search or an exhaustive phase map, and a validated goal or bounded fallback. The reduced toy-plasma model remains a separate educational estimate.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .heading { font: 700 24px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .subheading { font: 400 15px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .stage { font: 700 16px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .detail { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .number { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #ffffff; }
      .note { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #7c3aed; }
    </style>
  </defs>

  <rect width="1200" height="390" fill="#ffffff"/>
  <text x="40" y="46" class="heading">Sequential model pipeline</text>
  <text x="40" y="72" class="subheading">Each candidate moves through the same physics stages before a result is accepted.</text>

  <g stroke="#cbd5e1" stroke-width="2">
    <rect x="40" y="108" width="192" height="112" rx="6" fill="#f8fafc"/>
    <rect x="272" y="108" width="192" height="112" rx="6" fill="#f8fafc"/>
    <rect x="504" y="108" width="192" height="112" rx="6" fill="#f8fafc"/>
    <rect x="736" y="108" width="192" height="112" rx="6" fill="#fff7ed" stroke="#fdba74"/>
    <rect x="968" y="108" width="192" height="112" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  </g>

  <g>
    <circle cx="64" cy="132" r="14" fill="#0f766e"/>
    <circle cx="296" cy="132" r="14" fill="#0f766e"/>
    <circle cx="528" cy="132" r="14" fill="#0f766e"/>
    <circle cx="760" cy="132" r="14" fill="#b45309"/>
    <circle cx="992" cy="132" r="14" fill="#15803d"/>
    <text x="64" y="137" text-anchor="middle" class="number">1</text>
    <text x="296" y="137" text-anchor="middle" class="number">2</text>
    <text x="528" y="137" text-anchor="middle" class="number">3</text>
    <text x="760" y="137" text-anchor="middle" class="number">4</text>
    <text x="992" y="137" text-anchor="middle" class="number">5</text>
  </g>

  <g text-anchor="middle">
    <text x="136" y="163" class="stage">Algebraic Kerr</text>
    <text x="136" y="185" class="detail">reservoir bound</text>
    <text x="368" y="163" class="stage">Kerr geodesics</text>
    <text x="368" y="185" class="detail">trajectory validity</text>
    <text x="600" y="163" class="stage">Penrose split</text>
    <text x="600" y="185" class="detail">extraction ledger</text>
    <text x="832" y="163" class="stage">Dijkstra search</text>
    <text x="832" y="185" class="detail">or exhaustive phase map</text>
    <text x="1064" y="163" class="stage">Validated goal</text>
    <text x="1064" y="185" class="detail">or bounded fallback</text>
  </g>

  <g fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M232 164 H264"/>
    <path d="M464 164 H496"/>
    <path d="M696 164 H728"/>
    <path d="M928 164 H960"/>
  </g>

  <rect x="736" y="286" width="220" height="72" rx="6" fill="#faf5ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="846" y="316" text-anchor="middle" class="stage">Reduced toy-plasma</text>
  <text x="846" y="338" text-anchor="middle" class="detail">educational estimate only</text>
  <path d="M956 322 H1064 V230" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="1008" y="308" text-anchor="middle" class="note">separate path</text>
</svg>
