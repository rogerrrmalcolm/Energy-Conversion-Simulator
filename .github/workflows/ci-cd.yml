name: C++ CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: ${{ matrix.os }} / C++20
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBH_BUILD_TESTS=ON
          -DBH_ENABLE_AVX2=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build --build-config Release --output-on-failure

  compare-backends:
    name: Compare scalar and AVX2
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure scalar kernel
        run: >
          cmake -S . -B build-scalar
          -DCMAKE_BUILD_TYPE=Release
          -DBH_BUILD_TESTS=OFF
          -DBH_ENABLE_AVX2=OFF

      - name: Build scalar kernel
        run: cmake --build build-scalar --config Release --parallel

      - name: Configure AVX2 kernel
        run: >
          cmake -S . -B build-avx2
          -DCMAKE_BUILD_TYPE=Release
          -DBH_BUILD_TESTS=OFF
          -DBH_ENABLE_AVX2=ON

      - name: Build AVX2 kernel
        run: cmake --build build-avx2 --config Release --parallel

      - name: Compare correctness and benchmark
        run: >
          python3 scripts/compare_backends.py
          --scalar build-scalar/black-hole-sim
          --avx2 build-avx2/black-hole-sim
          --scenario benchmarks/penrose_phase_map_100.cfg
          --repetitions 3

  validate-container:
    name: Validate Docker image
    needs: compare-backends
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: black-hole-simulator:ci
          provenance: false
          cache-from: type=gha,scope=container
          cache-to: type=gha,mode=max,scope=container

      - name: Smoke-test container
        run: |
          docker run --rm black-hole-simulator:ci \
            --map-penrose \
            /opt/black-hole/share/black_hole_energy_simulation/scenarios/equatorial_penrose_avx2_smoke.cfg \
            | tee /tmp/phase-map.txt
          grep -Eq 'AVX2 four-lane batches:[[:space:]]+[1-9]' /tmp/phase-map.txt

  publish-container:
    name: Publish Docker image
    if: github.event_name == 'push'
    needs: validate-container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=container
          provenance: true
          sbom: true

      - name: Verify published image
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          tag="$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)"
          image="${tag%:*}"
          docker run --rm "$image@$IMAGE_DIGEST" \
            --map-penrose \
            /opt/black-hole/share/black_hole_energy_simulation/scenarios/equatorial_penrose_avx2_smoke.cfg \
            | tee /tmp/published-phase-map.txt
          grep -Eq 'AVX2 four-lane batches:[[:space:]]+[1-9]' /tmp/published-phase-map.txt

  release-windows:
    name: Publish Windows release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: compare-backends
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure release
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBH_BUILD_TESTS=ON
          -DBH_ENABLE_AVX2=ON

      - name: Build release
        run: cmake --build build --config Release --parallel

      - name: Verify release
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Install release files
        run: cmake --install build --config Release --prefix package

      - name: Create release archive
        shell: pwsh
        run: |
          $archive = "black-hole-simulator-$env:GITHUB_REF_NAME-windows-x64.zip"
          Compress-Archive -Path "package\*" -DestinationPath $archive
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $env:ARCHIVE --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $env:ARCHIVE --generate-notes --verify-tag
          }
