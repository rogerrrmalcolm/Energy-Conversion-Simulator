# Versioned, normalized Dijkstra search scenario. The black hole and particle
# model stay fixed; Dijkstra varies only the three local split parameters.
scenario_version = 1
black_hole_mass = 1.0
dimensionless_spin = 0.999
parent_rest_mass = 1.0
fragment_rest_mass = 0.0
incoming_specific_energy = 1.0
initial_radius_over_m = 10.0
escape_radius_over_m = 20.0
integration_step = 0.002
max_integration_steps = 50000
integration_absolute_tolerance = 1e-10
integration_relative_tolerance = 1e-9
integration_minimum_step = 0.0
residual_tolerance = 1e-7

# This is the declared starting candidate, not an observed black-hole property.
split_radius_over_m = 1.09
incoming_lz_over_m_m = 2.07
split_angle_rad = -2.0

# Search for the closest valid candidate reaching 4 percent net efficiency.
search_eta_target = 0.04
search_split_radius_lower = 1.08
search_split_radius_upper = 1.12
search_split_radius_step = 0.01
search_incoming_lz_lower = 2.05
search_incoming_lz_upper = 2.09
search_incoming_lz_step = 0.01
search_split_angle_lower = -2.02
search_split_angle_upper = -1.98
search_split_angle_step = 0.01

# The baseline uses scalar Dijkstra: h = 0 and every one-step edge costs 1.
search_radius_step_cost = 1
search_incoming_lz_step_cost = 1
search_split_angle_step_cost = 1
search_max_evaluations = 125
# Zero disables a wall-clock stop condition and keeps the reference deterministic.
search_time_budget_ms = 0
search_algorithm = dijkstra_h_zero
