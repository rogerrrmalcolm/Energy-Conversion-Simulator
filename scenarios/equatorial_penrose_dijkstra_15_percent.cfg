# Primary bounded Dijkstra search for the project's 15 percent target: find a
# physically valid event reaching 15 percent
# net Penrose efficiency. For a_star = 0.999, the equatorial ergosphere spans
# approximately 1.04471018 M < r_split < 2 M. The radius grid stays strictly
# inside those open boundaries.
scenario_version = 1
black_hole_mass = 1.0
dimensionless_spin = 0.999
parent_rest_mass = 1.0
fragment_rest_mass = 0.0
incoming_specific_energy = 1.0
initial_radius_over_m = 10.0
escape_radius_over_m = 20.0
integration_step = 0.002
max_integration_steps = 50000
integration_absolute_tolerance = 1e-10
integration_relative_tolerance = 1e-9
integration_minimum_step = 0.0
residual_tolerance = 1e-7

# Dijkstra starts here and changes one grid coordinate per unit-cost edge.
split_radius_over_m = 1.09
incoming_lz_over_m_m = 2.07
split_angle_rad = -2.0

search_eta_target = 0.15

# This covers every 0.01 M grid point between the outer horizon and the
# equatorial static limit while retaining strict numerical boundary margins.
search_split_radius_lower = 1.05
search_split_radius_upper = 1.99
search_split_radius_step = 0.01

# Radius is the only coordinate whose physical domain is set by the
# ergosphere. These exploratory Lz and angle bounds remain deliberately small.
search_incoming_lz_lower = 2.05
search_incoming_lz_upper = 2.09
search_incoming_lz_step = 0.01
search_split_angle_lower = -2.02
search_split_angle_upper = -1.98
search_split_angle_step = 0.01

search_radius_step_cost = 1
search_incoming_lz_step_cost = 1
search_split_angle_step_cost = 1

# 95 radius values * 5 Lz values * 5 angle values = 2375 candidates, below the
# scalar per-window limit of 2700. This budget covers every declared grid node.
search_max_evaluations = 2375
search_time_budget_ms = 0
search_algorithm = dijkstra_h_zero
